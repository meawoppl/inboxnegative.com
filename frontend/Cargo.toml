[package]
name = "inboxnegativefrontend"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.30"
gloo = {version = "0.11.0"}
gloo-net = "0.6.0"
chrono = {version="0.4.38", features = ["serde"]}
serde_json = "1.0.127"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
web-sys = {version = "0.3.70", features = ['Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window', 'ReadableStream', "Window", "HtmlDocument", "Element", "ShadowRoot", "ShadowRootInit", "ShadowRootMode", "Clipboard", "Navigator"]}

yew = {version="0.21", features=["csr"]}

shared = { path = "../shared" }
gloo-timers = "0.3.0"
