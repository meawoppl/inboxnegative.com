[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.10.0", features = ["serde", "v4"] }
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
jwt = "0.16.0"
sha2 = "0.10.8"
hmac = "0.12.1"
url = "2.5.2"
mail-parser = { version = "0.9.4", features = ["serde"] }
ammonia = "4.1.2"
regex = "1.10.4"
log = "0.4"
