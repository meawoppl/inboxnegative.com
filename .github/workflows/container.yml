name: Container

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-release:
    name: Build Release Artifacts
    # ubuntu-22.04 (glibc 2.35) so the binary runs on the debian:bookworm-slim
    # runtime base (glibc 2.36, newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-v0"
          shared-key: "release"
      - name: Install trunk
        run: cargo install trunk --locked
      # Frontend must be built before the backend so rust-embed embeds the
      # assets into the release binary.
      - name: Build frontend (release)
        run: cd frontend && trunk build --release
      - name: Build backend (release, embeds frontend assets)
        run: cargo build --release --locked -p inboxnegative
      - name: Assemble build-output
        run: |
          mkdir -p build-output
          cp target/release/inboxnegative build-output/inboxnegative
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output
          retention-days: 7

  container:
    name: Build Container
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output
      - name: Make binary executable
        run: chmod +x build-output/inboxnegative
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # On PRs: build only (validates the image). On main: push to GHCR.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
